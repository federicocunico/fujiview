[package]
name = "fujiview"
version = "0.2.7"
description = "High-performance Fujifilm preset comparison viewer"
authors = ["FujiView"]
edition = "2021"

[lib]
name = "fujiview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff"] }
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"] }
fast_image_resize = { version = "6.1", features = ["image", "rayon"] }
kamadak-exif = "0.6"
blake3 = "1.8"
natord = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Devices_PortableDevices",
  "Win32_Devices_Properties",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"
